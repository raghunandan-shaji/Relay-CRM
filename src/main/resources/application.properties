spring.application.name=scalable-crm
spring.config.import=optional:file:.local/jwt.properties,optional:file:.local/staff.properties
crm.auth.secret-base64=${JWT_SECRET:}
crm.auth.staff-emails=${CRM_STAFF_EMAILS:}
crm.search.initialize=${SEARCH_INITIALIZE:true}
crm.sales.initialize=${SALES_INITIALIZE:true}
crm.customer-cache.key-prefix=crm:profile:v1:
crm.customer-cache.ttl=${CUSTOMER_CACHE_TTL:60s}

crm.id.worker-id=${ID_WORKER_ID:0}

crm.sharding.virtual-nodes=${SHARD_VIRTUAL_NODES:256}
crm.sharding.nodes[0].id=shard-0
crm.sharding.nodes[0].uri=${MONGODB_SHARD_0_URI:mongodb://localhost:27017/crm?serverSelectionTimeoutMS=1000&connectTimeoutMS=1000}
crm.sharding.nodes[1].id=shard-1
crm.sharding.nodes[1].uri=${MONGODB_SHARD_1_URI:mongodb://localhost:27018/crm?serverSelectionTimeoutMS=1000&connectTimeoutMS=1000}
crm.sharding.nodes[2].id=shard-2
crm.sharding.nodes[2].uri=${MONGODB_SHARD_2_URI:mongodb://localhost:27019/crm?serverSelectionTimeoutMS=1000&connectTimeoutMS=1000}

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/crm}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s

crm.rate-limit.key-prefix=crm:rate-limit:
crm.rate-limit.login=${RATE_LIMIT_LOGIN:10}
crm.rate-limit.registration=${RATE_LIMIT_REGISTRATION:5}
crm.rate-limit.api=${RATE_LIMIT_API:120}
crm.rate-limit.window=${RATE_LIMIT_WINDOW:60s}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

server.shutdown=graceful
server.address=${SERVER_ADDRESS:127.0.0.1}
server.forward-headers-strategy=none
spring.lifecycle.timeout-per-shutdown-phase=20s
